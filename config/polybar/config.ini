[bar/main]
monitor = eDP-1
width = 98%
height = 35
offset-x = 1%
offset-y = 8
radius = 16
fixed-center = true

background = #1e1e2e
foreground = #cdd6f4

padding-left = 2
padding-right = 2
module-margin-left = 2
module-margin-right = 2

font-0 = "Noto Sans:size=11;2"
font-1 = "Symbols Nerd Font:size=11;2"

; Layout structure: Logo and workspaces on the left, date in center, stats/audio on the right
modules-left = logo bspwm
modules-center = date
modules-right = wifi cpu memory battery pulseaudio powermenu

;;; MODULES LEFT ;;;

[module/logo]
type = custom/text
content = " 󰣇 "
content-foreground = #89b4fa

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
inline-mode = false

enable-click = true
enable-scroll = true
reverse-scroll = false

format = <label-state> <label-mode>
label-focused = %index%
label-focused-background = #313244
label-focused-foreground = #a6e3a1
label-focused-padding = 2

label-occupied = %index%
label-occupied-foreground = #89b4fa
label-occupied-padding = 2

label-empty = %index%
label-empty-foreground = #6c7086
label-empty-padding = 2

;;; MODULE CENTER ;;;

[module/date]
type = internal/date
interval = 5
; Format: Sun, Sept 13 2026 | 07:34 pm
date = %a, %h %d %Y | %I:%M %p
format-prefix = "󰥔  "
format-prefix-foreground = #89b4fa
label = %date%

;;; MODULES RIGHT ;;;

[module/wifi]
type = internal/network
interface-type = wireless
interval = 5

format-connected = <ramp-signal> <label-connected>
label-connected = %essid%
label-connected-foreground = #cdd6f4

format-disconnected = <label-disconnected>
label-disconnected = 󰖪 disconnected
label-disconnected-foreground = #6c7086

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-foreground = #89b4fa

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "  "
format-prefix-foreground = #fab387
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛  "
format-prefix-foreground = #f38ba8
label = %used%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁾
ramp-capacity-4 = 󰂀
ramp-capacity-5 = 󰁹
ramp-capacity-6 = 󰁹
ramp-capacity-foreground = #a6e3a1

animation-charging-0 = 󰂈
animation-charging-1 = 󰂈
animation-charging-2 = 󰂄
animation-charging-foreground = #f9e2af
animation-charging-interval = 750

[module/pulseaudio]
type = internal/pulseaudio

; Prevents volume from shooting past 100% into infinity/amplification overdrive
use-ui-max = false
interval = 5

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%

label-muted = 󰝟 muted
label-muted-foreground = #6c7086

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = #fab387

[module/powermenu]
type = custom/text
content = "  "
content-foreground = #f38ba8
click-left = ~/.config/bspwm/powermenu.sh

[settings]
pseudo-transparency = true
